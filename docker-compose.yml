services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bulkmove
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bulkmove"]
      interval: 2s
      retries: 30

  # One-shot: apply schema, seed a small dataset, run the test suite.
  setup:
    build: .
    environment: &env
      DATABASE_URL: postgres://postgres:postgres@db:5432/bulkmove
    command: sh -c "npm run migrate && npm run seed -- --small && npm test"
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    environment: *env
    command: npm run api
    ports: ["3000:3000"]
    depends_on:
      setup: { condition: service_completed_successfully }

  worker:
    build: .
    environment: *env
    command: npm run worker
    depends_on:
      setup: { condition: service_completed_successfully }
